<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 100" fill="none">
  <!-- ClubForge Final Logo — E2 Twin Cubes -->
  <!-- Navy cube (back) + Gold cube (front) interlocking -->
  <!-- Wordmark: "Club" navy #0F172A, "Forge" gold #C5A456 -->

  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@800&amp;display=swap');
    </style>
  </defs>

  <!-- ========== TWIN CUBES MARK ========== -->
  <g transform="translate(4, 2)">
    <!-- Back cube (NAVY) -->
    <polygon points="52,4 86,24 52,44 18,24" fill="#1E293B"/>
    <polygon points="18,24 52,44 52,72 18,52" fill="#0F172A"/>
    <polygon points="52,44 86,24 86,52 52,72" fill="#162033"/>

    <!-- Front cube (GOLD — offset down-left, overlapping) -->
    <polygon points="34,26 68,46 34,66 0,46" fill="#D4B86A"/>
    <polygon points="0,46 34,66 34,92 0,72" fill="#C5A456"/>
    <polygon points="34,66 68,46 68,72 34,92" fill="#B8943D"/>
  </g>

  <!-- ========== WORDMARK ========== -->
  <text x="116" y="64" font-family="'Inter', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="40" letter-spacing="-0.02em">
    <tspan fill="#0F172A">Club</tspan><tspan fill="#C5A456">Forge</tspan>
  </text>
</svg>
