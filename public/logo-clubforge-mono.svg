<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 100" fill="none">
  <!-- ClubForge Monochrome Logo — Black version -->

  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@800&amp;display=swap');
    </style>
  </defs>

  <g transform="translate(4, 2)">
    <!-- Back cube -->
    <polygon points="52,4 86,24 52,44 18,24" fill="#333333"/>
    <polygon points="18,24 52,44 52,72 18,52" fill="#1A1A1A"/>
    <polygon points="52,44 86,24 86,52 52,72" fill="#262626"/>

    <!-- Front cube -->
    <polygon points="34,26 68,46 34,66 0,46" fill="#666666"/>
    <polygon points="0,46 34,66 34,92 0,72" fill="#4D4D4D"/>
    <polygon points="34,66 68,46 68,72 34,92" fill="#404040"/>
  </g>

  <text x="116" y="64" font-family="'Inter', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="40" letter-spacing="-0.02em">
    <tspan fill="#1A1A1A">Club</tspan><tspan fill="#4D4D4D">Forge</tspan>
  </text>
</svg>
