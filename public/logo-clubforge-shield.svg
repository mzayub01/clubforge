  <!-- Central spine — gold backbone running vertically -->
  <rect x="29" y="14" width="6" height="44" rx="3" fill="#C5A456"/>
  
  <!-- Cross beam — structural integrity -->
  <rect x="18" y="30" width="28" height="5" rx="2.5" fill="#C5A456" opacity="0.6"/>
</svg>
