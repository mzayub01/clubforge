<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 72" fill="none">
  <!-- Concept C: Modern Abstract Shield — Protection + backbone -->
  <!-- Clean angular shield with a vertical gold spine running through it -->
  
  <!-- Shield body — two halves creating a chevron/shield form -->
  <!-- Left half -->
  <path d="M32 4L6 16v24c0 12 10 22 26 28" fill="#0F172A"/>
  <!-- Right half — slightly lighter to show structure -->
