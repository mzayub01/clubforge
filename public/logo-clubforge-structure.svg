<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Concept B: Abstract Structural Foundation — Building blocks ascending -->
  <!-- 4 interlocking blocks forming an upward structure like infrastructure being forged -->
  
  <!-- Base block — foundation -->
  <rect x="6" y="42" width="52" height="14" rx="4" fill="#0F172A"/>
  
  <!-- Middle-left block -->
  <rect x="6" y="24" width="24" height="14" rx="4" fill="#0F172A"/>
  
  <!-- Middle-right block — gold keystone = the forge connection -->
  <rect x="34" y="24" width="24" height="14" rx="4" fill="#C5A456"/>
  
  <!-- Top block — platform reaching upward -->
  <rect x="16" y="6" width="32" height="14" rx="4" fill="#0F172A"/>
</svg>
